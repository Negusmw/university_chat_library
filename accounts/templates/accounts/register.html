{% load static %}
<!DOCTYPE html>
<html>
<head><title>Register</title></head>
<body>
<h2>Register</h2>

{% if error_msg %}
<div style="background:red;color:white;padding:10px;margin:10px 0;">{{ error_msg }}</div>
{% endif %}
{% if error %}
<div style="background:red;color:white;padding:10px;margin:10px 0;">{{ error }}</div>
{% endif %}

<form method="post">
{% csrf_token %}
<input type="text" name="username" placeholder="Username" required><br><br>
<input type="email" name="email" placeholder="Email" required><br><br>
<input type="password" name="password1" placeholder="Password" required><br><br>
<input type="password" name="password2" placeholder="Confirm Password" required><br><br>
<button type="submit">Register</button>
</form>

<p><a href="/accounts/login/">Already have account? Login</a></p>
</body>
</html>
