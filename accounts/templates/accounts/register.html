<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #071a3d, #124b85);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 440px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 45px rgba(0,0,0,.2);
        }

        h1 { color: #071a3d; text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #667085; margin-bottom: 25px; }

        label {
            display: block;
            font-weight: bold;
            margin: 16px 0 7px;
            color: #172554;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd4e0;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #f5c451;
            color: #071a3d;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .message { color: #b42318; font-size: 14px; }
        .bottom { text-align: center; margin-top: 20px; color: #667085; }
        a { color: #124b85; font-weight: bold; }
        .brand { text-align: center; color: #b38620; font-size: 13px; }
    </style>
</head>
<body>
    <main class="card">
        <p class="brand">UNIVERSITY CHAT &amp; LIBRARY</p>
        <h1>Create Account</h1>
        <p class="subtitle">Join your university community.</p>

        {% if messages %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="username">Username</label>
            <input id="username" name="username" type="text"
                   autocomplete="username" required>

            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                   autocomplete="email" required>

            <label for="password1">Password</label>
            <input id="password1" name="password1" type="password"
                   autocomplete="new-password" required>

            <label for="password2">Confirm password</label>
            <input id="password2" name="password2" type="password"
                   autocomplete="new-password" required>

            <button type="submit">Create Account</button>
        </form>

        <p class="bottom">
            Already registered?
            <a href="/accounts/login/">Log in</a>
        </p>
    </main>
</body>
</html>
